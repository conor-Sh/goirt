name: CI

on:
  pull_request:
  push:
    branches:
      - fm/goirt-build-v1

permissions:
  contents: read

jobs:
  pipeline:
    name: Pipeline and fixture checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Unit tests
        run: uv run python -m unittest discover -s pipeline -p 'test_*.py' -v

      - name: Privacy scan
        run: uv run python pipeline/privacy_scan.py

  site:
    name: Site typecheck, unit tests and fixture smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install site dependencies
        run: pnpm --dir site install --frozen-lockfile

      - name: Typecheck
        run: pnpm --dir site typecheck

      - name: Unit tests
        run: pnpm --dir site test

      - name: Build
        run: pnpm --dir site build

      - name: Install Playwright Chromium
        run: pnpm --dir site exec playwright install --with-deps chromium

      - name: Fixture smoke test
        run: pnpm --dir site test:e2e
